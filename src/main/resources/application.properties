
spring.application.name=ai-circular-connect

# Neon PostgreSQL Database
spring.datasource.url=${NEON_DATABASE_URL}
spring.datasource.username=${NEON_DATABASE_USERNAME}
spring.datasource.password=${NEON_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server — use Render's dynamic PORT, fallback to 8081 for local dev
server.port=${PORT:8081}

# Gemini API (optional - classifier and chatbot require this)
gemini.api.key=${GEMINI_API_KEY:}
